name: Verify
# D32 / R39: the only verification definition. pages.yml reuses it before building.
# D37 / R40: branch protection on main requires the check names verify (ubuntu-latest) and
# verify (windows-latest); they are the two gate jobs at the end, which need every matrix member.
# Read-only token, no secrets, no model calls. Based on PR #5's hardening, with PR #4's manual trigger
# and all-branch pushes and PR #6's Python matrix.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify-ubuntu:
    if: github.repository == 'marcodiazleon/ai-implementation-lab' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (R56a, D47)
        with:
          persist-credentials: false
          # R43a: the build pins historical reports to the commit that added them.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, pinned by commit (R56a, D47)
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned by commit (R56a, D47)
        with:
          node-version: "22"
      # R56d: named security rules, inventory, pins and secrets; a failure here fails the matrix member and both gates.
      - run: python scripts/security_check.py
      # R39b: the committed evidence must describe these exact sources before anything is rerun.
      - run: python scripts/check_evidence.py
      - run: python scripts/check_evidence.py --save committed-latest.json
      - run: python scripts/verify.py
      # R39b: the rerun must reproduce every committed test status.
      - run: python scripts/check_evidence.py --against committed-latest.json
      - run: python scripts/build_pages.py
      - run: node --check web/cloud.js
      - run: node --check web/studio.js
      - run: node --check web/evidence.js
      - run: node --check web/evidence-rules.js
      - run: node --check web/public-demo.js
      - run: node --check web/sensitive-rules.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned by commit (R56a, D47)
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            evidence/latest.json
            evidence/sdd-check.json
            specs/001-support-demo/acceptance.csv
  verify-windows:
    if: github.repository == 'marcodiazleon/ai-implementation-lab' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (R56a, D47)
        with:
          persist-credentials: false
          # R43a: the build pins historical reports to the commit that added them.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, pinned by commit (R56a, D47)
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned by commit (R56a, D47)
        with:
          node-version: "22"
      # R56d: named security rules, inventory, pins and secrets; a failure here fails the matrix member and both gates.
      - run: python scripts/security_check.py
      # R39b: the committed evidence must describe these exact sources before anything is rerun.
      - run: python scripts/check_evidence.py
      - run: python scripts/check_evidence.py --save committed-latest.json
      - run: python scripts/verify.py
      # R39b: the rerun must reproduce every committed test status.
      - run: python scripts/check_evidence.py --against committed-latest.json
      - run: python scripts/build_pages.py
      - run: node --check web/cloud.js
      - run: node --check web/studio.js
      - run: node --check web/evidence.js
      - run: node --check web/evidence-rules.js
      - run: node --check web/public-demo.js
      - run: node --check web/sensitive-rules.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned by commit (R56a, D47)
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            evidence/latest.json
            evidence/sdd-check.json
            specs/001-support-demo/acceptance.csv
  gate-ubuntu:
    # R40: exact required name; runs even if a member failed, was skipped or was cancelled, and then fails.
    name: verify (ubuntu-latest)
    needs: [verify-ubuntu, verify-windows]
    if: always() && github.repository == 'marcodiazleon/ai-implementation-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (R56a, D47)
        with:
          persist-credentials: false
      - run: python3 scripts/ci_gate.py ubuntu-latest "ubuntu-latest=${{ needs.verify-ubuntu.result }}" "windows-latest=${{ needs.verify-windows.result }}"
  gate-windows:
    # R40: exact required name; runs even if a member failed, was skipped or was cancelled, and then fails.
    name: verify (windows-latest)
    needs: [verify-ubuntu, verify-windows]
    if: always() && github.repository == 'marcodiazleon/ai-implementation-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (R56a, D47)
        with:
          persist-credentials: false
      - run: python3 scripts/ci_gate.py windows-latest "ubuntu-latest=${{ needs.verify-ubuntu.result }}" "windows-latest=${{ needs.verify-windows.result }}"
