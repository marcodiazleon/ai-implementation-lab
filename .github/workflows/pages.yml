name: Public demo (GitHub Pages)
# D32: verification is the reusable verify.yml; the site ships the committed evidence (D21).
# Only the deploy job holds Pages permissions, and only on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    needs: verify
    if: github.repository == 'marcodiazleon/ai-implementation-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (R56a, D47)
        with:
          persist-credentials: false
          # R43a: the build pins historical records to the commit that recorded them.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, pinned by commit (R56a, D47)
        with:
          python-version: "3.13"
      - run: python scripts/security_check.py
      - run: python scripts/check_evidence.py
      - run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1, pinned by commit (R56a, D47)
        with:
          path: _site
  deploy:
    needs: build
    if: github.repository == 'marcodiazleon/ai-implementation-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0, pinned by commit (R56a, D47)
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5, pinned by commit (R56a, D47)
